name: Firmware, OTA artifacts and recovery checks
on:
  push:
    branches: [main, dev, 'feature/**', 'hotfix/**']
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check branch workflow
        run: python3 tools/check_branch_policy.py
      - name: Resolve version from Git tag and commit
        id: version
        run: |
          make version
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = json.loads(Path('build/version.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + record['version'] + '\n')
          PY
      - name: Host behavior and fault-injection tests
        run: make test sanitize
      - name: ARM toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi
      - name: Build and validate MCU OTA payload and Boot
        run: make ota
      - name: Execute ARM clock initialization with SAM D20 register widths
        run: |
          python3 -m venv build/hal-venv
          build/hal-venv/bin/pip install -r requirements-hal.txt
          build/hal-venv/bin/python tools/verify_platform_clock.py build/m1-app.elf build/m1-boot.elf --report build/platform-clock-verification.json
      - name: Upload MCU OTA candidate
        uses: actions/upload-artifact@v4
        with:
          name: m1-mcu-ota-${{ steps.version.outputs.version }}
          path: build/ota/
          if-no-files-found: error
          retention-days: 30

      - name: Upload ELF and SWD recovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m1-mcu-debug-recovery-${{ steps.version.outputs.version }}
          path: |
            build/m1-app.elf
            build/m1-app.map
            build/m1-app.json
            build/version.json
            build/m1-boot.bin
            build/m1-boot.elf
            build/m1-boot.map
            build/m1-boot.json
            build/platform-clock-verification.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish MCU GitHub Release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: m1-mcu-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      TAG_NAME: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact tag and main ancestry
        run: |
          python3 tools/check_version.py --tag "$TAG_NAME"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v4
        with:
          name: m1-mcu-ota-${{ needs.verify.outputs.version }}
          path: build/incoming/ota
      - uses: actions/download-artifact@v4
        with:
          name: m1-mcu-debug-recovery-${{ needs.verify.outputs.version }}
          path: build/incoming/debug
      - name: Prepare frozen notes and verified release assets
        run: |
          acceptance=()
          if python3 - "$TAG_NAME" <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from check_version import is_stable_release
          sys.exit(0 if is_stable_release(sys.argv[1]) else 1)
          PY
          then
            git fetch origin main
            git show "origin/main:docs/release/acceptance/$TAG_NAME.json" > build/hardware-acceptance.json
            acceptance=(--acceptance build/hardware-acceptance.json)
          fi
          python3 tools/release/prepare.py "$TAG_NAME" "$GITHUB_SHA" --ota build/incoming/ota --debug build/incoming/debug --output build/release "${acceptance[@]}"
          cd build/release
          sha256sum -c SHA256SUMS
      - name: Publish immutable MCU release
        run: python3 tools/release/publish.py "$TAG_NAME" --directory build/release
